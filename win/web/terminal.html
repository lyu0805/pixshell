<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixShell Terminal</title>
<link rel="stylesheet" href="xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; }
  #terminal-container { position: absolute; inset: 0; padding: 4px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="terminal-container"></div>

<!-- 本地内嵌，运行时不连外网 -->
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
// ---------------------------------------------------------------------------
// PixShell 终端页面：真实终端，等待 C# 注入输出 + 回传用户输入 / 尺寸。
//
// 与 C# 的桥（消息协议见 MainWindow.xaml.cs）：
//   收 (C#→JS): {"t":"out","d":"<base64(UTF-8)>"}  |  {"t":"status","d":"..."}
//   发 (JS→C#): {"t":"in","d":"<按键>"} | {"t":"resize","cols":N,"rows":N} | {"t":"ready"}
// ---------------------------------------------------------------------------
const term = new Terminal({
  cursorBlink: true,
  cursorStyle: 'block',
  fontSize: 14,
  fontFamily: 'Consolas, "Courier New", monospace',
  scrollback: 5000,
  theme: { background: '#1e1e1e', foreground: '#d4d4d4' }
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal-container'));

// WebView2 注入的桥对象；若不在 WebView2 里（纯浏览器调试）则退化为 console。
const bridge = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
function post(obj) {
  if (bridge) bridge.postMessage(JSON.stringify(obj));
}

// base64(UTF-8) → 字符串，喂给 xterm。
function b64ToStr(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// 收 C# 消息。
if (bridge) {
  bridge.addEventListener('message', (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.t === 'out') {
      term.write(b64ToStr(msg.d));
    } else if (msg.t === 'status') {
      term.write('\r\n\x1b[90m[pixshell] ' + msg.d + '\x1b[0m\r\n');
    } else if (msg.t === 'theme' && msg.theme) {
      // 终端配色方案（Terminal/TermSchemes.cs → C# 侧 ApplyTermScheme 推来的 theme 对象）。
      try { term.options.theme = msg.theme; } catch (e) { /* 忽略，不影响终端可用性 */ }
    }
  });
}

// 用户输入 → 回传 C#（原始按键/转义序列）。
term.onData((data) => post({ t: 'in', d: data }));

// 远端 OSC 标题（如 shell 设置的 \x1b]0;title\x07）→ 回传 C#，用于更新 tab 头。
term.onTitleChange((title) => post({ t: 'title', d: title }));

// 尺寸变化 → fit 后上报行列，C# 据此设置 PTY 尺寸。
function doFit() {
  try { fit.fit(); } catch {}
  post({ t: 'resize', cols: term.cols, rows: term.rows });
}
term.onResize(() => post({ t: 'resize', cols: term.cols, rows: term.rows }));
window.addEventListener('resize', doFit);

// 供 C# 菜单调用：调整字号后重新 fit（触发一次 resize 上报）。
window.termFontSize = term.options.fontSize || 14;
window.pixSetFontSize = function (size) {
  window.termFontSize = Math.max(8, Math.min(32, Number(size) || 14));
  term.options.fontSize = window.termFontSize;
  doFit();
};

// 供 C# 连接成功后调用：聚焦并重新 fit（触发一次 resize 上报）。
window.pixFocus = function () { term.focus(); doFit(); };

// 首屏提示 + 首次 fit + 通知 C# 就绪。
term.write('\x1b[1;36mPixShell\x1b[0m native (Windows) — 就绪，填写上方连接信息后点「连接」\r\n');
doFit();
post({ t: 'ready' });
</script>
</body>
</html>
