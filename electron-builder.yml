# Packaging targets — multi-platform distribution surface
appId: com.pixshell.app
productName: PixShell
directories:
  output: dist
  buildResources: build
files:
  - packages/**/*
  - package.json
  - start.js
  - scripts/import-hosts.js
  - scripts/import-quick.js
  - scripts/import-config.js
  - build/icon.png
  - build/icon.ico
  - build/icon.icns
  - '!**/*.bak'
  - '!**/*.bak-*'
  - '!**/*.bak-legacy'
  - '!**/hosts.json'
  - '!**/settings.json'
  - '!**/quick-commands.json'
  - '!**/*.pem'
  - '!**/*.ppk'
  - '!**/*.key'
  - '!**/代码说明概要.md'
  - '!logs/**'
  - '!_private/**'
  - '!scripts/local-tools/**'
extraMetadata:
  main: packages/app/main/main.js
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  title: PixShell ${version}
  writeUpdateInfo: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PixShell
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
linux:
  icon: build/icon.png
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
    - target: zip
      arch:
        - x64
